[project]
name = "dora-payments"
version = "0.1.0"
description = "DORA Universal Payment & SmartWatch Module"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "qrcode>=7.4.2",
    "httpx>=0.27.0"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
